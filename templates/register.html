{% extends "base.html" %}
{% block title %}Create account · Love Is Like Coding{% endblock %}
{% block content %}
<main class="stage">
  <section class="card auth">
    <h1>Create account</h1>
    <p class="muted">Take the quiz, track your heart status, and find out how the story ends.</p>
    <form method="post" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Username
        <input name="username" type="text" required minlength="3" maxlength="24"
               pattern="[A-Za-z0-9_]+" autocomplete="username" value="{{ form.get('username', '') }}">
        <small>3-24 letters, numbers or underscores</small>
      </label>
      <label>Email
        <input name="email" type="email" required maxlength="120" autocomplete="email" value="{{ form.get('email', '') }}">
      </label>
      <label>Password
        <input name="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password">
        <small>At least 8 characters</small>
      </label>
      <button class="btn love" type="submit">Create account</button>
    </form>
    <p class="small">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
  </section>
</main>
{% endblock %}
