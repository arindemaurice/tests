{% extends "base.html" %}
{% block title %}Log in · Love Is Like Coding{% endblock %}
{% block content %}
<main class="stage">
  <section class="card auth">
    <h1>Log in</h1>
    <p class="muted">Welcome back. Your heart status is waiting.</p>
    <form method="post" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Username or email
        <input name="identity" type="text" required autocomplete="username" maxlength="120">
      </label>
      <label>Password
        <input name="password" type="password" required autocomplete="current-password" maxlength="128">
      </label>
      <button class="btn love" type="submit">Log in</button>
    </form>
    <p class="small">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </section>
</main>
{% endblock %}
